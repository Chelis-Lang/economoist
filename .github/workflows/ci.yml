name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHELIS_TAG: v0.19.1
  CHELIS_VERSION: 0.19.1

jobs:
  hard-rule-guard:
    name: Hard rules (pin consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test forge compiler-pin derivation
        run: python3 scripts/test_run_forge_tests.py
      - name: Exact compiler value decoder regressions
        run: python3 scripts/test_oracle_harness.py
      - name: Hard rule -- all chelis pin locations agree
        run: python3 scripts/audit_workarounds.py --pins-only

  no-ai-authorship:
    name: No AI authorship markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commits for AI authorship markers
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          event_name = os.environ["GITHUB_EVENT_NAME"]
          if event_name == "pull_request":
              base = os.environ["GITHUB_BASE_REF"]
              subprocess.run(["git", "fetch", "origin", base], check=False)
              rev_range = f"origin/{base}..HEAD"
          else:
              before = "${{ github.event.before }}"
              rev_range = f"{before}..HEAD" if before and before != "0" * 40 else "HEAD~1..HEAD"

          try:
              commits = subprocess.check_output(["git", "rev-list", rev_range], text=True).splitlines()
          except subprocess.CalledProcessError:
              commits = [subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()]

          msg_pats = [
              re.compile(r"(Co-)?Authored-By:.*(claude|anthropic|openai|codex|chatgpt|copilot)", re.I),
              re.compile(r"Generated (with|by).*(claude|openai|codex|chatgpt|copilot|gpt-[0-9]|ai|llm)", re.I),
          ]
          id_pat = re.compile(r"(claude|anthropic|openai|codex|chatgpt|copilot)", re.I)
          failed = False
          for sha in commits:
              msg = subprocess.check_output(["git", "log", "-1", "--format=%B", sha], text=True)
              author = subprocess.check_output(["git", "log", "-1", "--format=%an <%ae>", sha], text=True)
              committer = subprocess.check_output(["git", "log", "-1", "--format=%cn <%ce>", sha], text=True)
              for p in msg_pats:
                  if p.search(msg):
                      print(f"FAIL: {sha} message matches {p.pattern}"); failed = True
              for label, val in (("author", author), ("committer", committer)):
                  if id_pat.search(val):
                      print(f"FAIL: {sha} {label}: {val.strip()}"); failed = True
          sys.exit(1 if failed else 0)
          PY

  chelis-gate:
    name: Chelis gate
    runs-on: ubuntu-latest
    needs: [hard-rule-guard, no-ai-authorship]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install chelis toolchain (cached)
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ github.token }}

      - name: Format check
        run: |
          set -euo pipefail
          for f in src/*.ch properties/*.ch demos/*.ch sampled/*.ch tests/*.ch; do
            [ -e "$f" ] || continue
            chelis fmt --check "$f"
          done

      - name: Lint check
        run: chelis lint --check src/ properties/ demos/ sampled/ tests/

      - name: Reef package build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: chelis reef build .

      - name: Shell contract conformance
        run: chelis reef conform audit

      - name: Negative tests
        run: chelis test tests_neg --expect neg

      - name: Blocked probes
        run: |
          if find tests_blocked -name '*.ch' -print -quit | grep -q .; then
            chelis test tests_blocked --expect blocked
          else
            echo "No executable blocked probes at this pin."
          fi

  book:
    name: Book (mdBook build, writing lint, examples)
    # docs/book is rendered from the chelis.ch docs. Build it, lint the book
    # and README against the writing standard, and run every book example
    # against this checkout's source with the pinned toolchain.
    runs-on: ubuntu-latest
    needs: [hard-rule-guard, no-ai-authorship]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2
      - name: Build mdBook
        run: mdbook build docs/book
      - name: Lint book and README
        run: python3 scripts/check_book.py docs/book/src README.md
      - name: Install chelis toolchain (cached)
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ github.token }}
      - name: Run book examples against the source
        run: python3 scripts/check_book_examples.py

  contract-gate:
    name: Contract gate (manifest consistency)
    # Fast, offline: validates docs/cnote-import-surface.json against the frozen
    # characterization contract (schema/pin freshness, property + control
    # resolution, precondition/where-clause cross-check, proof citations). No
    # chelis toolchain needed -- pure source + reef.toml parsing.
    runs-on: ubuntu-latest
    needs: [hard-rule-guard, no-ai-authorship]
    steps:
      - uses: actions/checkout@v4
      - name: Validate the invariant-surface manifest against the contract
        run: python3 scripts/contract_gate.py

  # The per-PR contract gate validates the manifest offline, and the Chelis
  # gate builds the package. The release-binary SMT proof and forge checks run
  # in scripts/run_local_gate.py before push and in nightly.yml.
