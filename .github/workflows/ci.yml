name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHELIS_TAG: v0.8.0
  CHELIS_VERSION: 0.8.0

jobs:
  hard-rule-guard:
    name: Hard rules (pin consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hard rule -- all chelis pin locations agree
        run: python3 scripts/audit_workarounds.py --pins-only

  no-ai-authorship:
    name: No AI authorship markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commits for AI authorship markers
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          event_name = os.environ["GITHUB_EVENT_NAME"]
          if event_name == "pull_request":
              base = os.environ["GITHUB_BASE_REF"]
              subprocess.run(["git", "fetch", "origin", base], check=False)
              rev_range = f"origin/{base}..HEAD"
          else:
              before = "${{ github.event.before }}"
              rev_range = f"{before}..HEAD" if before and before != "0" * 40 else "HEAD~1..HEAD"

          try:
              commits = subprocess.check_output(["git", "rev-list", rev_range], text=True).splitlines()
          except subprocess.CalledProcessError:
              commits = [subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()]

          msg_pats = [
              re.compile(r"(Co-)?Authored-By:.*(claude|anthropic|openai|codex|chatgpt|copilot)", re.I),
              re.compile(r"Generated (with|by).*(claude|openai|codex|chatgpt|copilot|gpt-[0-9]|ai|llm)", re.I),
          ]
          id_pat = re.compile(r"(claude|anthropic|openai|codex|chatgpt|copilot)", re.I)
          failed = False
          for sha in commits:
              msg = subprocess.check_output(["git", "log", "-1", "--format=%B", sha], text=True)
              author = subprocess.check_output(["git", "log", "-1", "--format=%an <%ae>", sha], text=True)
              committer = subprocess.check_output(["git", "log", "-1", "--format=%cn <%ce>", sha], text=True)
              for p in msg_pats:
                  if p.search(msg):
                      print(f"FAIL: {sha} message matches {p.pattern}"); failed = True
              for label, val in (("author", author), ("committer", committer)):
                  if id_pat.search(val):
                      print(f"FAIL: {sha} {label}: {val.strip()}"); failed = True
          sys.exit(1 if failed else 0)
          PY

  chelis-gate:
    name: Chelis gate
    runs-on: ubuntu-latest
    needs: [hard-rule-guard, no-ai-authorship]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install chelis toolchain (cached)
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}

      - name: Format check
        run: |
          set -euo pipefail
          for f in src/*.ch properties/*.ch demos/*.ch tests/*.ch; do
            [ -e "$f" ] || continue
            chelis fmt --check "$f"
          done

      - name: Lint check
        run: chelis lint --check src/ properties/ demos/ tests/

      - name: Reef package build
        env:
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: chelis reef build .

      - name: Negative tests
        run: python3 scripts/run_negative_tests.py

      - name: Blocked probes
        run: python3 scripts/run_blocked_probes.py

  smt-prove-gate:
    name: SMT prove gate (from-source build)
    # Pinned (not ubuntu-latest) so a cached binary's glibc always matches the
    # runtime; the cache key carries the same slug.
    runs-on: ubuntu-24.04
    needs: [hard-rule-guard, no-ai-authorship]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Generous so a cold cvc5 compile finishes and SAVES the cache rather than
    # timing out and leaving every run to rebuild.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # The SMT binary depends only on the pinned chelis tag. Cache the built
      # binary itself keyed on the tag: cvc5 compiles from source once per pin,
      # and every later run restores the 62 MB binary and skips the build.
      - name: Restore cached chelis-smt binary
        id: smt-bin
        uses: actions/cache@v4
        with:
          path: smt-bin
          key: chelis-smt-${{ env.CHELIS_TAG }}-ubuntu-24.04

      - name: Checkout chelis at pinned release
        if: steps.smt-bin.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: Chelis-Lang/chelis
          ref: ${{ env.CHELIS_TAG }}
          path: chelis-src
          token: ${{ secrets.CHELIS_RELEASE_TOKEN }}

      - name: Install C dependencies
        if: steps.smt-bin.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc g++ cmake libclang-dev

      - name: Install Rust toolchain
        if: steps.smt-bin.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      # Second cache layer: cargo registry and cvc5 build artifacts, so a binary
      # cache miss (pin bump or eviction) still rebuilds incrementally.
      - name: Cache cargo (smt)
        if: steps.smt-bin.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: chelis-src
          key: smt

      - name: Build chelis with --features smt
        if: steps.smt-bin.outputs.cache-hit != 'true'
        working-directory: chelis-src
        run: cargo build --release -p chelis-cli --features smt

      - name: Stage built binary for the cache
        if: steps.smt-bin.outputs.cache-hit != 'true'
        run: |
          mkdir -p smt-bin
          cp chelis-src/target/release/chelis smt-bin/chelis-smt

      - name: Set CHELIS_SMT_BIN
        run: echo "CHELIS_SMT_BIN=${{ github.workspace }}/smt-bin/chelis-smt" >> "$GITHUB_ENV"

      - name: Verify smt binary
        run: "$CHELIS_SMT_BIN --version"

      - name: Run prove gate
        run: python3 scripts/prove_gate.py
