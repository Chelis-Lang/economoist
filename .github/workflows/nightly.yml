name: nightly

# Weekly re-run of the SMT proof gate and the numeric oracle harness against
# the pinned RELEASE chelis binary. SMT ships in the released tarball as of
# chelis v0.11.0 (chelis#422 resolved), so this installs the pinned toolchain
# via the shared composite action -- no from-source cvc5 build. Per-PR CI
# (ci.yml) runs the same prove gate on every PR; this weekly job is a drift
# detector that fires even with no economoist push, surfacing an upstream
# proof-tier regression at the pinned release. The chelis pin is carried as a
# literal CHELIS_TAG/CHELIS_VERSION env pair (read by the offline pin guard) and
# cross-checked at runtime against reef.toml, the single source of truth.

on:
  schedule:
    - cron: '0 6 * * 0'   # 06:00 UTC, Sundays (weekly)
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

# Literal chelis pin (contract section 2): this workflow installs a toolchain
# (the pinned release tarball, via the shared composite action), so it carries a
# matching CHELIS_TAG/CHELIS_VERSION pair that the offline pin guard
# (scripts/audit_workarounds.py --pins-only) reads without running the workflow.
# The reef.toml derivation below stays as a runtime cross-check.
env:
  CHELIS_TAG: v0.14.0
  CHELIS_VERSION: 0.14.0

jobs:
  prove:
    name: SMT prove + oracle (release binary)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cross-check the literal chelis pin against reef.toml
        run: |
          set -euo pipefail
          REEF_CHELIS_VERSION=$(grep -oP '^compiler\s*=\s*"=\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml)
          if [ -z "$REEF_CHELIS_VERSION" ]; then
            echo "Failed to parse compiler pin from reef.toml" >&2
            cat reef.toml >&2
            exit 1
          fi
          # The literal env pin must agree with reef.toml; the offline guard
          # enforces this too, this is the in-workflow belt-and-braces check.
          if [ "$REEF_CHELIS_VERSION" != "${CHELIS_VERSION}" ]; then
            echo "Pin drift: reef.toml=$REEF_CHELIS_VERSION but env CHELIS_VERSION=${CHELIS_VERSION}" >&2
            exit 1
          fi
          echo "Detected: chelis=${CHELIS_VERSION} (tag ${CHELIS_TAG})"

      - name: Install chelis toolchain (cached)
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}

      - name: Run prove gate
        run: python3 scripts/prove_gate.py

      - name: Run oracle harness
        if: hashFiles('scripts/oracle_harness.py') != ''
        run: python3 scripts/oracle_harness.py

  # Surface a nightly failure as a tracking issue (opens on failure, closes
  # on green) so a red nightly is impossible to miss -- scheduled-run
  # failures do not show a red status on main. `needs` the prove job;
  # `if: always()` so it runs regardless of outcome.
  report:
    name: Surface nightly status
    needs: [prove]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open/close nightly-failure tracking issue
        uses: actions/github-script@v7
        env:
          PROVE_RESULT: ${{ needs.prove.result }}
        with:
          script: |
            const title = 'Nightly failing: economoist';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const failed = process.env.PROVE_RESULT !== 'success';
            const q = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            const existing = found.data.items.find(i => i.title === title);
            if (failed) {
              if (existing) {
                core.info(`Tracking issue #${existing.number} already open.`);
              } else {
                const issue = await github.rest.issues.create({
                  owner, repo, title,
                  body: `The **nightly** release-binary prove gate failed (prove=${process.env.PROVE_RESULT}).\n\nRun: ${runUrl}\nCommit: \`${context.sha}\`\n\nAuto-opened on failure; auto-closes when the nightly next passes.`,
                  labels: ['nightly-failure'],
                });
                core.info(`Opened tracking issue #${issue.data.number}.`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Nightly green again -- ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info(`Closed tracking issue #${existing.number}.`);
            }
