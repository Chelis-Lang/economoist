name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Literal chelis pin (contract section 2): every toolchain-installing workflow
# carries a matching CHELIS_TAG/CHELIS_VERSION pair that the offline pin guard
# (scripts/audit_workarounds.py --pins-only) reads without running the workflow.
# The reef.toml derivation below stays as a runtime cross-check, but these
# literals are the source the guard compares against the reef pin.
env:
  PACKAGE_NAME: economoist
  CHELIS_TAG: v0.17.4
  CHELIS_VERSION: 0.17.4

jobs:
  build-reef-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract versions from reef.toml (cross-check the literal pin)
        id: versions
        run: |
          REEF_CHELIS_VERSION=$(grep -oP '^compiler\s*=\s*"=\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml)
          PACKAGE_VERSION=$(grep -oP '^version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml | head -1)
          if [ -z "$REEF_CHELIS_VERSION" ] || [ -z "$PACKAGE_VERSION" ]; then
            echo "Failed to parse one or more versions from reef.toml" >&2
            cat reef.toml >&2
            exit 1
          fi
          # The literal env pin must agree with reef.toml; the offline guard
          # enforces this too, this is the in-workflow belt-and-braces check.
          if [ "$REEF_CHELIS_VERSION" != "${CHELIS_VERSION}" ]; then
            echo "Pin drift: reef.toml=$REEF_CHELIS_VERSION but env CHELIS_VERSION=${CHELIS_VERSION}" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "Detected: chelis=${CHELIS_VERSION} economoist=$PACKAGE_VERSION"

      - name: Download chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
        run: |
          gh release download "${CHELIS_TAG}" \
            --repo Chelis-Lang/chelis \
            --pattern "chelis-${CHELIS_TAG}-linux-x86_64.tar.gz" \
            --dir /tmp/chelis-toolchain
          tar -xzf "/tmp/chelis-toolchain/chelis-${CHELIS_TAG}-linux-x86_64.tar.gz" \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-${CHELIS_TAG}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: test "$(chelis --version)" = "chelis ${CHELIS_VERSION}"

      - name: Build reef assets
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
        run: chelis reef build

      - name: Stage the invariant-surface manifest as a release asset
        # The characterization contract (chelis-shell.invariant-surface/1.0)
        # requires each shell to publish a byte-identical copy of its manifest as
        # <pkg>-<ver>.invariants.json; C Note vendors THIS asset and freshness-
        # gates it. Guard the pin/version in the manifest against reef.toml first.
        run: |
          set -euo pipefail
          python3 scripts/contract_gate.py
          mkdir -p dist
          cp docs/cnote-import-surface.json "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.invariants.json"

      - name: Verify release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          test "${GITHUB_REF_NAME#v}" = "${PACKAGE_VERSION}"
          test -f "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.tar.zst"
          test -f "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.chb"
          test -f "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.invariants.json"
          cmp docs/cnote-import-surface.json "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.invariants.json"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}.tar.zst
            dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}.chb
            dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}.invariants.json
          generate_release_notes: true
          fail_on_unmatched_files: true
